  <!-- ── Page-load splash screen styles (inlined so loader shows before JS) ── -->
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    #app-loader.ldr-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .ldr-logo {
      width: clamp(340px, 86vw, 760px);
      max-width: 92vw;
      height: auto;
      margin-bottom: 40px;
      animation: ldr-breathe 2s ease-in-out infinite;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.07));
    }
    .ldr-track {
      width: clamp(240px, 60vw, 420px);
      height: 5px;
      background: rgba(15, 23, 42, 0.08);
      border-radius: 99px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    .ldr-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1fb81f 0%, #16a34a 100%);
      border-radius: 99px;
      box-shadow: 0 0 12px rgba(31, 184, 31, 0.6);
      animation: ldr-progress 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    .ldr-text {
      margin-top: 18px;
      font-family: Poppins, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: #64748b;
      text-transform: uppercase;
    }
    @keyframes ldr-progress {
      0%   { width: 0%; }
      55%  { width: 75%; }
      80%  { width: 90%; }
      100% { width: 100%; }
    }
    @keyframes ldr-breathe {
      0%, 100% { opacity: 1;    transform: scale(1);    }
      50%       { opacity: 0.82; transform: scale(0.96); }
    }
  </style>
</head>

<body>
  <!-- Splash loader — JS removes it once React has mounted -->
  <div id="app-loader" role="status" aria-label="Loading Montra Electric">
    <img
      class="ldr-logo"
      src="/navbar-logo/montra-logo-hbk.svg"
      alt="Montra Electric"
      width="760"
      height="158"
    />
    <div class="ldr-track">
      <div class="ldr-fill"></div>
    </div>
    <p class="ldr-text">Loading&hellip;</p>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
